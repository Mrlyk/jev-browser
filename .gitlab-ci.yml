stages: [test, native, package]

# Runner tags are deployment configuration. Each native runner needs Node >=22
# and a current stable Rust toolchain; no publish credential is used here.
test:
  stage: test
  tags: [linux-x64]
  script:
    - npm ci
    - npm test

native:
  stage: native
  parallel:
    matrix:
      - RUNNER: [macos-arm64, macos-x64, linux-x64, linux-arm64, windows-x64]
  tags: [$RUNNER]
  script:
    - npm run build:core
    - cargo test --profile ci --locked --manifest-path cli/Cargo.toml --bin jev-browser-core connection::tests
  artifacts:
    paths: [libexec/]
    expire_in: 7 days

package:
  stage: package
  tags: [linux-x64]
  needs: [native, test]
  variables:
    JEV_RELEASE: '1'
  script:
    - npm ci
    - node scripts/licenses.mjs
    - npm pack
  artifacts:
    paths: ['jev-browser-*.tgz']
    expire_in: 30 days
